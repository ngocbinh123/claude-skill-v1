# Mirror-only board sync (hybrid architecture — see docs/ticket-automation.md).
#
# GitHub Actions has no trigger for Projects v2 Status changes, so this
# workflow polls the board on a schedule and mirrors each issue's Status into
# a `status:<value>` label. Nothing else: no AI, no rules. All AI work runs
# in the local dispatcher (tools/ai-ticket-dispatcher.sh).
name: ticket-status-automation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticket-status-automation
  cancel-in-progress: false

env:
  PROJECT_OWNER: ngocbinh123
  PROJECT_NUMBER: "2"
  STATUS_FIELD: Status

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Require PROJECT_TOKEN secret
        run: |
          if [ -z "${{ secrets.PROJECT_TOKEN }}" ]; then
            echo "::error::PROJECT_TOKEN secret is missing (PAT with project read + repo scope). See docs/ticket-automation.md"
            exit 1
          fi

      - name: Mirror board Status to status:* labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const query = `
              query($login: String!, $number: Int!, $cursor: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        fieldValueByName(name: "${process.env.STATUS_FIELD}") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          ... on Issue {
                            number
                            repository { nameWithOwner }
                            labels(first: 100) { nodes { name } }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            const items = [];
            let cursor = null;
            do {
              const res = await github.graphql(query, {
                login: process.env.PROJECT_OWNER,
                number: parseInt(process.env.PROJECT_NUMBER, 10),
                cursor,
              });
              const conn = res.user.projectV2.items;
              items.push(...conn.nodes);
              cursor = conn.pageInfo.hasNextPage ? conn.pageInfo.endCursor : null;
            } while (cursor);

            const { owner, repo } = context.repo;
            const repoFull = `${owner}/${repo}`.toLowerCase();

            for (const item of items) {
              const issue = item.content;
              if (!issue || !issue.number) continue; // draft item or PR
              if (issue.repository.nameWithOwner.toLowerCase() !== repoFull) continue;
              const status = item.fieldValueByName && item.fieldValueByName.name;
              if (!status) continue; // no Status set
              const cur = status.trim().toLowerCase();

              const mirror = issue.labels.nodes
                .map((l) => l.name)
                .find((n) => n.toLowerCase().startsWith('status:'));
              const prev = mirror ? mirror.slice('status:'.length).toLowerCase() : null;
              if (prev === cur) continue;

              const issue_number = issue.number;
              if (mirror) {
                await github.rest.issues
                  .removeLabel({ owner, repo, issue_number, name: mirror })
                  .catch(() => {});
              }
              const name = `status:${cur}`;
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
              } catch (e) {
                await github.rest.issues
                  .createLabel({ owner, repo, name, color: 'ededed' })
                  .catch(() => {});
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
              }
              core.info(`#${issue_number}: status label ${prev ?? '(none)'} -> ${cur}`);
            }
